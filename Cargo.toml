[package]
name = "fgoxide"
version = "0.7.0"
edition = "2024"
authors = [
    "Tim Fennell <tim@fulcrumgenomics.com>",
    "Nils Homer <nils@fulcrumgenomics.com>"
]
license = "MIT"
repository = "https://github.com/fulcrumgenomics/fgoxide"
description = "Utility/QoL code for writing command-line / file processing tools."
documentation = "https://docs.rs/fgoxide"
readme = "README.md"
categories = ["rust-patterns"]
keywords = ["utilities"]
rust-version = "1.85"

[dependencies]
thiserror = "^2"

# Magic-byte sniffing of compressed inputs (gz/bz2/xz/zstd) and dispatch on write.
# niffler's default features pull in gzip (via flate2), bzip2, xz, and zstd codecs.
niffler = "^3"

# For auto-serialization of structs to csv/tsv
csv = "^1"
serde = { version = "^1.0.123", features = ["derive"] }
serde-aux = "^4"

[dev-dependencies]
tempfile = "^3"
rstest = "^0.26"
